      (() => {
        const key = 'lufs-theme';
        const root = document.documentElement;
        const system = window.matchMedia('(prefers-color-scheme: dark)');
        const normalize = (value) =>
          value === 'light' || value === 'dark' ? value : 'system';
        let preference = 'system';
        try {
          preference = normalize(localStorage.getItem(key));
        } catch {
          // Storage may be unavailable in private or restricted contexts.
        }
        const apply = () => {
          root.dataset.theme = preference === 'system'
            ? (system.matches ? 'dark' : 'light')
            : preference;
          root.style.colorScheme = root.dataset.theme;
          root.dataset.preference = preference;
          const button = document.getElementById('theme-toggle');
          const names = { system: '系统', light: '浅色', dark: '深色' };
          const next = { system: 'light', light: 'dark', dark: 'system' };
          if (button) {
            button.setAttribute('aria-label', `当前：${names[preference]}；切换为${names[next[preference]]}`);
            button.title = `当前：${names[preference]}；点击切换`;
          }
        };
        apply();
        system.addEventListener('change', apply);
        document.addEventListener('astro:before-swap', (event) => {
          const nextRoot = event.newDocument.documentElement;
          nextRoot.dataset.theme = root.dataset.theme;
          nextRoot.dataset.preference = preference;
          nextRoot.style.colorScheme = root.style.colorScheme;
        });
        document.addEventListener('astro:after-swap', apply);
        window.addEventListener('storage', (event) => {
          if (event.key === key || event.key === null) {
            preference = normalize(event.newValue);
            apply();
          }
        });
        document.addEventListener('DOMContentLoaded', () => {
          const button = document.getElementById('theme-toggle');
          apply();
          button?.addEventListener('click', () => {
            preference = { system: 'light', light: 'dark', dark: 'system' }[preference];
            apply();
            try { localStorage.setItem(key, preference); } catch {}
          });
        }, { once: true });
      })();
